name: Build and Deploy Capitale

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'Dockerfile'
      - 'src/**'
      - 'assets/**'
      - 'style/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'kube/capitale/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: kingbrady/capitale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            FLAVOUR=capitale
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment image tag
        run: |
          sed -i "s|image: kingbrady/capitale:.*|image: kingbrady/capitale:${{ steps.version.outputs.VERSION }}|" kube/capitale/deployment.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kube/capitale/deployment.yaml
          kubectl rollout status deployment/capitale -n capitale --timeout=120s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
