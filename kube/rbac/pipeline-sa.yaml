apiVersion: v1
kind: ServiceAccount
metadata:
  name: capitale-pipeline-sa
  namespace: capitale
---
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-sa-token
  namespace: capitale
  annotations:
    kubernetes.io/service-account.name: capitale-pipeline-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-admin
  namespace: capitale
subjects:
  - kind: ServiceAccount
    name: capitale-pipeline-sa
    namespace: capitale
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-admin
  namespace: countryle
subjects:
  - kind: ServiceAccount
    name: capitale-pipeline-sa
    namespace: capitale
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
